name: Test local CasePilot AI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free/open-source dependencies
        run: npm install --no-audit --no-fund
      - name: Run offline core tests
        run: npm test
      - name: Type-check and compile React UI
        run: npm run build
      - name: Run real local API smoke check
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-sqlite api/server.mjs >/tmp/casepilot-api.log 2>&1 &
          pid=$!
          trap 'cat /tmp/casepilot-api.log || true; kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4317/api/health > /tmp/casepilot-health.json; then break; fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/casepilot-health.json || { echo 'API failed to reach healthy status'; exit 1; }
          curl --fail --silent --header 'Content-Type: application/json' --data '{}' http://127.0.0.1:4317/api/demo | grep -q 'id'
      - name: Commit verified dependency lockfile on main
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Update dependency lockfile after verified build"
            git push
          fi
